<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Notas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">

    <section class="tarjeta">
      <form id="formAlumno" novalidate>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" autocomplete="off">

        <label for="c1">Certamen 1:</label>
        <input type="number" id="c1" min="0" max="100" step="any">

        <label for="c2">Certamen 2:</label>
        <input type="number" id="c2" min="0" max="100" step="any">

        <label for="c3">Certamen 3:</label>
        <input type="number" id="c3" min="0" max="100" step="any">

        <p id="mensaje" class="mensaje" role="alert"></p>

        <button type="submit" id="btnAgregar">Agregar Alumno</button>
        <p id="contador" class="contador">Alumnos registrados: 0 / 10</p>
      </form>
    </section>

    <section class="tarjeta" id="resultados"></section>

  </main>

  <script src="script.js"></script>
</body>
</html>
